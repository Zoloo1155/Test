<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хамгийн хөөрхөн охинд 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Comic Sans MS', cursive;
    overflow: hidden;
    touch-action: manipulation;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    width: 85%;
    max-width: 350px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: pop 0.8s ease;
}

h1 {
    color: #ff4d6d;
    font-size: 22px;
}

p {
    font-size: 16px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #ddd;
}

.heart {
    position: absolute;
    color: red;
    animation: float 4s linear infinite;
    pointer-events: none; /* утсан дээр маш чухал */
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-800px); opacity: 0; }
}

@keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card" id="card">
    <h1>💖 Хамгийн хөөрхөн охинд 💖</h1>
    <p>Хамгийн хөөрхөн охин чи надтай VALENTINE тэмдэглэх үү? 🥰</p>
    <button id="yes">ТИЙМ 💕</button>
    <button id="no">ҮГҮЙ 😅</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

// 👉 NO товч автоматаар зугтана
setInterval(() => {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}, 800); // 0.8 секунд тутам

// 👉 YES товч 100% ажиллана
yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
        <div class="card">
            <h1>ЯАААЙ!!! 💘</h1>
            <p>
                Би мэдэж байсан 😍<br>
                Валентины өдөр уулзъя 💕
            </p>
        </div>
    `;
});
</script>
